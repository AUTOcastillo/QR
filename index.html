<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cobro QR - Autoservicio Castillo</title>
    
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0f25">
    <link rel="apple-touch-icon" href="./icono-192.png">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; }

        :root {
            --color-fondo: #0a0f25; 
            --color-tarjeta: #11183b; 
            --color-oro: #d9b85c; 
            --color-oro-oscuro: #b89a45; 
            --color-texto: #f0f0f0; 
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            margin: 0;
            padding: 20px;
            min-height: 100dvh; 
            justify-content: center;
            background-color: var(--color-fondo); 
            color: var(--color-texto);
        }
        
        .card { 
            background: var(--color-tarjeta); 
            padding: 40px 30px; 
            border-radius: 16px; 
            border: 2px solid var(--color-oro); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.7); 
            text-align: center; 
            max-width: 380px;
            width: 100%;
            position: relative;
            overflow: hidden; 
        }

        .estado-red {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
            color: #ccc;
        }
        .dot { height: 10px; width: 10px; background-color: gray; border-radius: 50%; display: inline-block; }
        .dot.online { background-color: #4CAF50; box-shadow: 0 0 5px #4CAF50; }
        .dot.offline { background-color: #f44336; box-shadow: 0 0 5px #f44336; }

        h2 {
            color: var(--color-oro);
            font-family: "Times New Roman", Times, serif; 
            margin-top: 10px;
            margin-bottom: 25px;
            line-height: 1.1;
            font-weight: normal;
        }
        h2 .large-text { display: block; font-size: 38px; letter-spacing: 1px; }
        
        .input-group { margin-bottom: 15px; width: 100%; }
        label { display: block; font-size: 14px; margin-bottom: 10px; color: #ccc; }

        input[type="text"] { 
            font-size: 32px; 
            padding: 12px; 
            width: 100%; 
            text-align: center; 
            border: 2px solid var(--color-oro); 
            border-radius: 10px; 
            outline: none; 
            font-weight: bold;
            color: var(--color-tarjeta);
            background-color: #fff;
            transition: font-size 0.2s, border-color 0.3s; 
        }
        input[type="text"]:focus { 
            border-color: var(--color-oro-oscuro); 
            box-shadow: 0 0 12px rgba(217, 184, 92, 0.4);
        } 
        
        /* ESTILOS BOTONES RÁPIDOS */
        .botones-rapidos { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 20px; 
            justify-content: space-between; 
        }
        .btn-rapido { 
            font-size: 15px; 
            padding: 10px; 
            background-color: var(--color-tarjeta); 
            color: var(--color-oro); 
            border: 1px solid var(--color-oro); 
            flex: 1; 
            margin-top: 0; 
            text-transform: none;
            letter-spacing: normal;
            border-radius: 8px;
            cursor: pointer;
        }
        .btn-rapido:hover { background-color: rgba(217, 184, 92, 0.15); }

        button.btn-principal { 
            font-size: 17px; 
            font-weight: bold;
            padding: 14px 24px; 
            background-color: var(--color-oro); 
            color: var(--color-tarjeta); 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            transition: 0.3s; 
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        button.btn-principal:hover { background-color: var(--color-oro-oscuro); transform: translateY(-2px); }
        
        #qrcode { 
            margin: 25px auto 15px auto; 
            padding: 15px; 
            background: white; 
            border: 3px solid var(--color-oro); 
            border-radius: 12px; 
            display: none; 
            min-height: 200px; 
            min-width: 200px; 
            justify-content: center;
        }
        
        .info { 
            background: rgba(255, 255, 255, 0.05); 
            padding: 15px; 
            border-radius: 10px; 
            font-size: 16px; 
            color: #aaa; 
            transition: 0.3s; 
            border: 1px solid rgba(255,255,255,0.1);
        }
        .success { background: rgba(217, 184, 92, 0.15); color: var(--color-oro); border: 1px solid var(--color-oro); }

        #countdown-text {
            font-size: 17px; margin-top: 15px; display: none; color: #fff; font-family: monospace;
            background: rgba(0,0,0,0.3); padding: 8px 12px; border-radius: 8px; letter-spacing: 1px;
        }
        .reloj-animado { display: inline-block; margin-right: 5px; animation: girarReloj 2s infinite ease-in-out; }
        @keyframes girarReloj { 0%, 20% { transform: rotate(0deg); } 40%, 60% { transform: rotate(180deg); } 80%, 100% { transform: rotate(360deg); } }

        #modal-pago {
            display: none; 
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--color-fondo); 
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            cursor: pointer; 
        }
        .modal-titulo { font-family: "Times New Roman", Times, serif; font-size: 42px; color: var(--color-oro); margin-bottom: 40px; letter-spacing: 2px;}
        .modal-monto { font-size: 72px; font-weight: bold; color: var(--color-texto); margin-bottom: 20px; }
        .modal-banco { font-size: 38px; font-weight: bold; color: var(--color-oro); margin-bottom: 30px;}
        .modal-instruccion { font-size: 16px; color: #888; animation: parpadeo 2s infinite;}
        @keyframes parpadeo { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* ESTILOS HISTORIAL DE CAJA */
        .historial-card {
            background: var(--color-tarjeta);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(217, 184, 92, 0.3);
            margin-top: 20px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
        }
        .historial-card h3 { color: var(--color-oro); margin-top: 0; margin-bottom: 15px; font-size: 18px; text-align: center; }
        .item-pago {
            display: flex; justify-content: space-between;
            padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 15px; color: #ccc;
        }
        .item-pago:last-child { border-bottom: none; }
        .total-dia {
            font-size: 22px; font-weight: bold; color: #4CAF50;
            text-align: right; margin-top: 15px; padding-top: 10px; border-top: 2px solid rgba(255,255,255,0.1);
        }
        .btn-limpiar {
            background-color: rgba(244, 67, 54, 0.1); color: #f44336;
            font-size: 14px; padding: 12px; margin-top: 15px; border: 1px solid #f44336;
            width: 100%; border-radius: 8px; cursor: pointer; transition: 0.3s;
        }
        .btn-limpiar:hover { background-color: #f44336; color: white; }

    </style>
</head>
<body>

    <audio id="sonido-pago" src="https://assets.mixkit.co/active_storage/sfx/861/861-preview.mp3" preload="auto"></audio>

    <div id="modal-pago">
        <div class="modal-titulo">PAGO RECIBIDO</div>
        <div class="modal-monto" id="pago-monto">$0</div>
        <div class="modal-banco" id="pago-banco">BANCO</div>
        <div class="modal-instruccion">Toca la pantalla para continuar</div>
    </div>

    <!-- TARJETA PRINCIPAL DE COBRO -->
    <div class="card">
        <div class="estado-red">
            <span class="dot offline" id="red-dot"></span>
            <span id="red-texto">Conectando...</span>
        </div>

        <h2>
            <span class="large-text">AUTOSERVICIO</span>
            <span class="large-text">CASTILLO</span>
        </h2>
        
        <div class="input-group">
            <label for="montoInput">Ingresa el valor a cobrar (COP)</label>
            <input type="text" id="montoInput" inputmode="numeric" placeholder="0" oninput="formatearMoneda(this)" onkeypress="if(event.key === 'Enter') generarQR()">
        </div>

        <!-- BOTONES RÁPIDOS -->
        <div class="botones-rapidos">
            <button class="btn-rapido" onclick="cobroRapido(5000)">$5.000</button>
            <button class="btn-rapido" onclick="cobroRapido(10000)">$10.000</button>
            <button class="btn-rapido" onclick="cobroRapido(20000)">$20.000</button>
        </div>

        <button class="btn-principal" onclick="generarQR()">Generar QR</button>

        <div id="qrcode"></div>
        
        <div id="status-box" class="info" style="margin-top: 15px;">
            <p id="payload-output" style="margin: 0;">Esperando monto...</p>
            <p id="countdown-text"></p>
        </div>
    </div>

    <!-- TARJETA DE HISTORIAL (CUADRE DE CAJA) -->
    <div class="historial-card">
        <h3>📋 Registro del Día</h3>
        <div id="lista-historial"></div>
        <div class="total-dia">Total: <span id="total-monto">$0</span></div>
        <button class="btn-limpiar" onclick="limpiarHistorial()">Cerrar Caja (Borrar Historial)</button>
    </div>

    <script>
        let qrCodeInstance = null;
        let intervaloReinicio = null;
        let tiempoRestante = 180; 
        let timeoutCierreModal = null; 
        let montoEsperado = 0; // NUEVO: Control de coincidencia exacta

        // Inicializar historial al cargar
        window.addEventListener('DOMContentLoaded', () => {
            cargarHistorial();
        });

        function formatearMoneda(input) {
            let valorLimpio = input.value.replace(/\D/g, "");
            if (valorLimpio === "") { 
                input.value = ""; 
                input.style.fontSize = "32px";
                return; 
            }
            input.value = new Intl.NumberFormat('es-CO').format(parseInt(valorLimpio, 10));

            if (input.value.length > 13) input.style.fontSize = "18px";
            else if (input.value.length > 9) input.style.fontSize = "24px";
            else input.style.fontSize = "32px";
        }

        // LÓGICA DE BOTONES RÁPIDOS
        function cobroRapido(valor) {
            let input = document.getElementById("montoInput");
            input.value = valor.toString();
            formatearMoneda(input);
            generarQR();
        }

        function calcularCRC16(str) {
            let crc = 0xFFFF;
            for (let i = 0; i < str.length; i++) {
                crc ^= str.charCodeAt(i) << 8;
                for (let j = 0; j < 8; j++) {
                    if ((crc & 0x8000) > 0) crc = (crc << 1) ^ 0x1021;
                    else crc = crc << 1;
                }
                crc &= 0xFFFF;
            }
            return crc.toString(16).toUpperCase().padStart(4, '0');
        }

        function actualizarReloj() {
            let minutos = Math.floor(tiempoRestante / 60);
            let segundos = tiempoRestante % 60;
            let formatoTiempo = minutos.toString().padStart(2, '0') + ":" + segundos.toString().padStart(2, '0');
            document.getElementById("countdown-text").innerHTML = `<span class="reloj-animado">⏳</span> Reinicio en ${formatoTiempo}`;
        }

        function reiniciarPantalla() {
            montoEsperado = 0; // NUEVO: Se borra el monto esperado al limpiar la pantalla
            if (intervaloReinicio !== null) { clearInterval(intervaloReinicio); intervaloReinicio = null; }
            let input = document.getElementById("montoInput");
            input.value = "";
            input.style.fontSize = "32px"; 
            
            let qrContainer = document.getElementById("qrcode");
            qrContainer.innerHTML = "";
            qrContainer.style.display = "none";
            document.getElementById("payload-output").innerText = "Esperando monto...";
            document.getElementById("countdown-text").style.display = "none";
            document.getElementById("status-box").classList.remove("success");
            input.focus();
        }

        function generarQR() {
            let inputElement = document.getElementById("montoInput");
            let montoIngresado = inputElement.value;
            let montoTexto = montoIngresado.replace(/\./g, "");
            let monto = parseFloat(montoTexto);
            
            if (isNaN(monto) || monto <= 0) { alert("Por favor ingresa un monto válido."); return; }

            montoEsperado = monto; // NUEVO: El sistema memoriza el cobro actual
            inputElement.blur(); 
            
            let montoFormateado = monto.toFixed(2);
            let longitudMonto = montoFormateado.length.toString().padStart(2, '0');
            let tag54 = "54" + longitudMonto + montoFormateado;

            const prefijo = "00020101021126320014CO.COM.RBM.LLA0510009067045349250014CO.COM.RBM.RED0103RBM50310013CO.COM.RBM.CU0110009067045351250013CO.COM.RBM.CA01044781520447815303170";
            const sufijo = "5802CO5921Autoservicio Castillo60051560061051560062200703000080200110363180270016CO.COM.RBM.CANAL0103APP81250015CO.COM.RBM.CIVA01020382260014CO.COM.RBM.IVA01040.0083270015CO.COM.RBM.BASE01040.0084250015CO.COM.RBM.CINC01020385260014CO.COM.RBM.INC01040.0090430016CO.COM.RBM.TRXID0119000000GNFGAVn0q9D1k91460014CO.COM.RBM.SEC01241EoTEvbEtWkeOvMT6OxIieLU6304";
            
            const payloadBase = prefijo + tag54 + sufijo;
            const crc = calcularCRC16(payloadBase);
            const payloadFinal = payloadBase + crc;

            document.getElementById("payload-output").innerHTML = `<strong>✅ Listo para escanear</strong><br><span style="font-size: 15px; margin-top:5px; display:block; color: #fff;">Valor: <b>$${montoIngresado}</b></span>`;
            document.getElementById("status-box").classList.add("success");

            let qrContainer = document.getElementById("qrcode");
            qrContainer.innerHTML = ""; 
            qrContainer.style.display = "inline-block"; 
            qrCodeInstance = new QRCode(qrContainer, {
                text: payloadFinal, width: 250, height: 250, colorDark : "#11183b", colorLight : "#ffffff", correctLevel : QRCode.CorrectLevel.M
            });
            
            if (intervaloReinicio !== null) clearInterval(intervaloReinicio);
            tiempoRestante = 180; 
            document.getElementById("countdown-text").style.display = "block";
            actualizarReloj();
            
            intervaloReinicio = setInterval(() => {
                tiempoRestante--;
                if (tiempoRestante <= 0) reiniciarPantalla();
                else actualizarReloj();
            }, 1000);
        }

        /* ==========================================
           LÓGICA DEL HISTORIAL DE CAJA
           ========================================== */
        function guardarTransaccion(monto, banco) {
            let historial = JSON.parse(localStorage.getItem('historialAutoservicio')) || [];
            let fechaActual = new Date();
            
            historial.push({
                monto: parseFloat(monto),
                banco: banco || 'APP',
                hora: fechaActual.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                fecha: fechaActual.toLocaleDateString()
            });
            
            localStorage.setItem('historialAutoservicio', JSON.stringify(historial));
            cargarHistorial();
        }

        function cargarHistorial() {
            let historial = JSON.parse(localStorage.getItem('historialAutoservicio')) || [];
            let lista = document.getElementById('lista-historial');
            let totalDiv = document.getElementById('total-monto');
            let fechaHoy = new Date().toLocaleDateString();
            
            lista.innerHTML = '';
            let total = 0;

            let historialHoy = historial.filter(item => item.fecha === fechaHoy);

            if (historialHoy.length === 0) {
                lista.innerHTML = '<p style="text-align:center; color:#666; font-size: 14px;">No hay pagos registrados hoy.</p>';
            } else {
                historialHoy.slice().reverse().forEach(item => {
                    let div = document.createElement('div');
                    div.className = 'item-pago';
                    let montoF = new Intl.NumberFormat('es-CO', {style: 'currency', currency: 'COP', maximumFractionDigits: 0}).format(item.monto);
                    div.innerHTML = `<span>${item.hora} - ${item.banco}</span> <strong>${montoF}</strong>`;
                    lista.appendChild(div);
                    total += item.monto;
                });
            }
            
            totalDiv.innerText = new Intl.NumberFormat('es-CO', {style: 'currency', currency: 'COP', maximumFractionDigits: 0}).format(total);
        }

        function limpiarHistorial() {
            if(confirm("¿Estás seguro de que deseas cerrar la caja? Esto borrará el registro de pagos en pantalla.")) {
                localStorage.removeItem('historialAutoservicio');
                cargarHistorial();
            }
        }

        /* ==========================================
           LÓGICA DEL PANEL DE PAGOS (API SONO)
           ========================================== */
        const API_URL = 'https://api.sono.lat/libreta/cad178eee9a7f636f78c96b09ef8314d';
        let ultimoId = 0;

        function actualizarEstadoRed(conectado) {
            const dot = document.getElementById("red-dot");
            const texto = document.getElementById("red-texto");
            if (conectado) {
                dot.className = "dot online"; texto.innerText = "En línea";
            } else {
                dot.className = "dot offline"; texto.innerText = "Desconectado";
            }
        }

        function cerrarModalYReiniciar() {
            document.getElementById("modal-pago").style.display = "none";
            if (timeoutCierreModal) clearTimeout(timeoutCierreModal);
            reiniciarPantalla();
        }

        function mostrarAlertaPago(monto, banco) {
            const bancoStr = banco ? banco.toUpperCase() : "BANCO";
            const montoNum = parseFloat(monto) || 0;
            const montoFormateado = new Intl.NumberFormat('es-CO', { 
                style: 'currency', currency: 'COP', maximumFractionDigits: 0 
            }).format(montoNum);

            // Se asume que esta función solo se llama si el pago coincidió correctamente
            guardarTransaccion(montoNum, bancoStr);

            document.getElementById("pago-monto").innerText = montoFormateado;
            document.getElementById("pago-banco").innerText = bancoStr;
            
            let modal = document.getElementById("modal-pago");
            modal.style.display = "flex";
            modal.onclick = cerrarModalYReiniciar;

            const sonido = document.getElementById('sonido-pago');
            sonido.currentTime = 0; 
            sonido.play().catch(e => console.log("Audio bloqueado:", e));

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); 
                const mensaje = new SpeechSynthesisUtterance(`Transferencia Exitosa Pagaron ${Math.floor(montoNum)} pesos`);
                mensaje.lang = 'es-CO';
                window.speechSynthesis.speak(mensaje);
            }

            if (timeoutCierreModal) clearTimeout(timeoutCierreModal);
            timeoutCierreModal = setTimeout(() => {
                cerrarModalYReiniciar();
            }, 30000);
        }

        async function revisarPagos() {
            try {
                const respuesta = await fetch(`${API_URL}?t=${new Date().getTime()}`, {
                    method: 'GET',
                    headers: { 'Cache-Control': 'no-cache, no-store, must-revalidate' }
                });

                if (!respuesta.ok) throw new Error("Error HTTP");
                const data = await respuesta.json();
                actualizarEstadoRed(true);

                if (data && data.latestId) {
                    const nuevoId = parseInt(data.latestId, 10);
                    if (ultimoId === 0) {
                        ultimoId = nuevoId;
                    } 
                    else if (nuevoId !== ultimoId && data.payments && data.payments.length > 0) {
                        const pago = data.payments[0];
                        const montoRecibido = parseFloat(pago.amount) || 0;

                        // NUEVO: El sistema valida que el pago coincida con el QR activo
                        if (montoEsperado > 0 && montoRecibido === montoEsperado) {
                            mostrarAlertaPago(pago.amount, pago.bank);
                            montoEsperado = 0; // Se apaga la memoria tras un cobro exitoso
                        }

                        // Siempre se avanza el ID para evitar procesar la misma transacción descartada
                        ultimoId = nuevoId;
                    }
                }
            } catch (error) {
                console.error("Falla de red o de API:", error);
                actualizarEstadoRed(false);
            }
        }

        revisarPagos();
        setInterval(revisarPagos, 5000);

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.error(err));
            });
        }
    </script>
</body>
</html>
